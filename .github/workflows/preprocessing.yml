# preprocessing.yml
# ===================
# Task 4 - GitHub Actions Workflow untuk K1 (Advance)
#
# Trigger: push ke branch main + manual dispatch (workflow_dispatch)
# Langkah:
#   1. Checkout kode
#   2. Setup Python 3.12
#   3. Install dependencies dari requirements.txt
#   4. Jalankan automate_Gevinta.py
#   5. Upload risktrace_preprocessing.csv sebagai artifact GitHub

name: Preprocessing Pipeline — RiskTrace

on:
  push:
    branches:
      - main
    paths:
      - "preprocessing/**"
      - "risktrace_raw.csv"
      - ".github/workflows/preprocessing.yml"
  workflow_dispatch:
    inputs:
      reason:
        description: "Alasan menjalankan workflow secara manual"
        required: false
        default: "Manual trigger"

jobs:
  preprocess:
    name: Run Automated Preprocessing
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout repository ──────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Setup Python 3.12 ────────────────────────────────────────────────
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # ── 3. Install dependencies ─────────────────────────────────────────────
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r preprocessing/requirements.txt

      # ── 4. Jalankan preprocessing script ───────────────────────────────────
      - name: Run automate_Gevinta.py
        run: |
          cd preprocessing
          python automate_Gevinta.py

      # ── 5. Upload artifact ──────────────────────────────────────────────────
      - name: Upload risktrace_preprocessing.csv
        uses: actions/upload-artifact@v4
        with:
          name: risktrace-preprocessing-${{ github.run_number }}
          path: preprocessing/risktrace_preprocessing.csv
          retention-days: 30

      # ── 6. Tampilkan ringkasan ──────────────────────────────────────────────
      - name: Print summary
        run: |
          echo "### ✅ Preprocessing berhasil!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Info | Detail |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Artifact | risktrace-preprocessing-${{ github.run_number }} |" >> $GITHUB_STEP_SUMMARY
